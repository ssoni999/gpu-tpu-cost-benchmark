<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPU vs TPU Benchmark Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- hardware-specs -->
  <style>
    :root {
      --bg: #0a0e14;
      --bg-subtle: #0f1419;
      --card: #151b24;
      --card-raised: #1a222d;
      --border: #2a3441;
      --border-subtle: #1f2833;
      --text: #e8edf4;
      --text-secondary: #c4cdd8;
      --muted: #7d8a9a;
      --gpu: #ff6b6b;
      --gpu-bright: #ff8787;
      --gpu-dim: rgba(255, 107, 107, 0.1);
      --gpu-glow: rgba(255, 107, 107, 0.25);
      --tpu: #4ade80;
      --tpu-bright: #86efac;
      --tpu-dim: rgba(74, 222, 128, 0.1);
      --tpu-glow: rgba(74, 222, 128, 0.25);
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --radius: 12px;
      --radius-sm: 8px;
      --code-bg: #0d1118;
      --section-bg: #121820;
      --pill-bg: rgba(96, 165, 250, 0.12);
      --pill-running-bg: rgba(251, 191, 36, 0.12);
      --pill-running: #fbbf24;
      --pill-missing-bg: rgba(255, 107, 107, 0.12);
      --pill-missing: #ff6b6b;
      --error-bg: rgba(255, 107, 107, 0.08);
      --error-border: rgba(255, 107, 107, 0.25);
      --error-text: #ff8787;
      --diff-bg: rgba(251, 191, 36, 0.08);
    }

    [data-theme="light"] {
      --bg: #f0f2f5;
      --bg-subtle: #e8ebef;
      --card: #ffffff;
      --card-raised: #ffffff;
      --border: #dfe3ea;
      --border-subtle: #eef0f4;
      --text: #1a1d24;
      --text-secondary: #3d4450;
      --muted: #5c6578;
      --gpu: #d93025;
      --gpu-bright: #e53935;
      --gpu-dim: #fce8e6;
      --gpu-glow: rgba(217, 48, 37, 0.15);
      --tpu: #137333;
      --tpu-bright: #1e8e3e;
      --tpu-dim: #e6f4ea;
      --tpu-glow: rgba(19, 115, 51, 0.15);
      --accent: #174ea6;
      --accent-hover: #1967d2;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
      --code-bg: #f4f5f7;
      --section-bg: #f8f9fb;
      --pill-bg: #e8f0fe;
      --pill-running-bg: #fef7e0;
      --pill-running: #b06000;
      --pill-missing-bg: #fce8e6;
      --pill-missing: #c5221f;
      --error-bg: #fce8e6;
      --error-border: #f5c6c2;
      --error-text: #c5221f;
      --diff-bg: #fef7e0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(96, 165, 250, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(74, 222, 128, 0.05), transparent),
        radial-gradient(ellipse 60% 40% at 0% 100%, rgba(255, 107, 107, 0.05), transparent);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    code {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      font-size: 0.85em;
      background: var(--code-bg);
      padding: 0.12em 0.4em;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    header {
      background: rgba(21, 27, 36, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    [data-theme="light"] header {
      background: rgba(255, 255, 255, 0.9);
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text) 0%, var(--muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    [data-theme="light"] h1 {
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .sub { color: var(--muted); font-size: 0.82rem; margin-top: 0.2rem; }
    .controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

    button {
      background: linear-gradient(180deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 85%, #000) 100%);
      color: #fff;
      border: none;
      padding: 0.5rem 0.95rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 2px 8px rgba(96, 165, 250, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(96, 165, 250, 0.35);
    }

    button:active { transform: translateY(0); }

    button.secondary {
      background: var(--card);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.secondary:hover {
      background: var(--card-raised);
      border-color: var(--muted);
      box-shadow: var(--shadow-sm);
    }

    button.theme-toggle {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      box-shadow: none;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      line-height: 1;
    }

    button.theme-toggle:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .pill {
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--accent);
      border: 1px solid transparent;
    }

    .pill.running {
      background: var(--pill-running-bg);
      color: var(--pill-running);
      border-color: rgba(251, 191, 36, 0.2);
    }

    .pill.missing, .pill.failed {
      background: var(--pill-missing-bg);
      color: var(--pill-missing);
      border-color: rgba(255, 107, 107, 0.2);
    }

    .layout {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    main { max-width: 1400px; margin: 0 auto; padding: 1.5rem 1.5rem 2.5rem; }

    .spec-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      align-items: start;
    }

    @media (max-width: 960px) {
      .spec-compare { grid-template-columns: 1fr; }
    }

    .sidebar { display: contents; }

    .spec-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .spec-card:hover { border-color: color-mix(in srgb, var(--border) 70%, var(--muted)); }
    .spec-card.gpu { border-top: 2px solid var(--gpu); }
    .spec-card.tpu { border-top: 2px solid var(--tpu); }

    .spec-head {
      padding: 0.7rem 1rem;
      font-size: 0.82rem;
      font-weight: 600;
      list-style: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      user-select: none;
      transition: background 0.15s ease;
    }

    .spec-head::-webkit-details-marker { display: none; }
    .spec-card[open] .spec-head { border-bottom: 1px solid var(--border); }
    .spec-head.gpu { color: var(--gpu-bright); background: var(--gpu-dim); }
    .spec-head.tpu { color: var(--tpu-bright); background: var(--tpu-dim); }
    .spec-head:hover { filter: brightness(1.08); }

    .spec-chevron {
      font-size: 0.65rem;
      opacity: 0.8;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .spec-card[open] .spec-chevron { transform: rotate(90deg); }
    .spec-body { background: var(--card); }

    .spec-row {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.76rem;
    }

    .spec-row:last-child { border-bottom: none; }
    .spec-row .k { color: var(--muted); }
    .spec-row .v { font-weight: 600; text-align: right; color: var(--text-secondary); }

    .content { min-width: 0; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

    @media (max-width: 800px) { .panels { grid-template-columns: 1fr; } }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .panel:hover { box-shadow: var(--shadow), 0 0 0 1px var(--border); }
    .panel.gpu { border-top: 2px solid var(--gpu); }
    .panel.tpu { border-top: 2px solid var(--tpu); }

    .panel-head {
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--section-bg);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .panel-head.tpu h2 { color: var(--tpu-bright); }
    .panel-head.gpu h2 { color: var(--gpu-bright); }

    .hero {
      padding: 1.5rem 1rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .hero.gpu {
      background: radial-gradient(ellipse 80% 100% at 50% 100%, var(--gpu-dim), transparent 70%);
    }

    .hero.tpu {
      background: radial-gradient(ellipse 80% 100% at 50% 100%, var(--tpu-dim), transparent 70%);
    }

    .hero.gpu .big {
      color: var(--gpu-bright);
      text-shadow: 0 0 40px var(--gpu-glow);
    }

    .hero.tpu .big {
      color: var(--tpu-bright);
      text-shadow: 0 0 40px var(--tpu-glow);
    }

    .hero .big { font-size: 2.25rem; font-weight: 700; letter-spacing: -0.03em; }
    .hero .label { color: var(--muted); font-size: 0.78rem; margin-top: 0.35rem; text-transform: uppercase; letter-spacing: 0.06em; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    .metric {
      padding: 0.7rem 1.1rem;
      border-bottom: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      transition: background 0.12s ease;
    }

    .metric:hover { background: rgba(255, 255, 255, 0.02); }
    [data-theme="light"] .metric:hover { background: rgba(0, 0, 0, 0.02); }
    .metric:nth-child(2n) { border-right: none; }

    .metric .k {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .metric .v {
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 0.2rem;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .metric.tpu-win .v { color: var(--tpu-bright); }
    .metric.gpu-behind .v { color: var(--gpu-bright); }

    .metric.tpu-win .indicator,
    .hero.tpu-win .indicator {
      display: inline-block;
      margin-left: 0.25rem;
      font-size: 0.85rem;
      color: var(--tpu-bright);
      font-weight: 700;
    }

    .metric-section {
      grid-column: 1 / -1;
      padding: 0.55rem 1.1rem;
      background: var(--section-bg);
      border-bottom: 1px solid var(--border);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    section.block { margin-top: 1.25rem; }

    section.block h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }

    .empty {
      padding: 2.5rem 1.25rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .empty code { font-size: 0.8rem; }

    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.76rem;
      color: var(--muted);
    }

    .compare-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      margin-bottom: 1.25rem;
      display: none;
      box-shadow: var(--shadow-sm);
    }

    .compare-bar.visible { display: block; }

    .compare-bar h3 {
      margin: 0 0 0.75rem;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .compare-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.45rem 0;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .compare-row:last-child { border-bottom: none; }
    .compare-row .winner { font-weight: 600; font-size: 0.8rem; }
    .compare-row .winner.tpu-win { color: var(--tpu-bright); }
    .compare-row .winner.gpu-win { color: var(--gpu-bright); }

    .error-banner {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1.1rem;
      margin: 0.75rem 1rem;
      font-size: 0.84rem;
    }

    .error-banner strong { color: var(--error-text); }
    .error-banner code { font-size: 0.78rem; border: none; background: rgba(0,0,0,0.2); }
    .error-list { margin: 0.5rem 0 0; padding-left: 1.2rem; color: var(--text-secondary); }

    .migration-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-sm);
    }

    .migration-bar h3 { margin: 0 0 0.75rem; font-size: 0.85rem; }
    .migration-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }

    .migration-table th, .migration-table td {
      text-align: left;
      padding: 0.4rem 0.55rem;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: top;
    }

    .migration-table th { color: var(--muted); font-weight: 500; }
    .migration-table .diff { background: var(--diff-bg); }

    .serving-block {
      padding: 0.75rem 1.1rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.76rem;
      color: var(--muted);
      background: var(--section-bg);
    }

    .serving-block strong { color: var(--text-secondary); }
    .serving-block code { font-size: 0.7rem; word-break: break-all; }

    .workload-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .workload-bar h3 {
      margin: 0 0 0.65rem;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .workload-toggle {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .workload-toggle button {
      background: var(--section-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      box-shadow: none;
      padding: 0.55rem 1rem;
      font-weight: 600;
      flex: 1;
      min-width: 100px;
    }

    .workload-toggle button:hover {
      border-color: var(--accent);
      color: var(--text);
      transform: none;
      box-shadow: var(--shadow-sm);
    }

    .workload-toggle button.active {
      background: linear-gradient(180deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 80%, #000) 100%);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 12px rgba(96, 165, 250, 0.3);
    }

    .workload-desc {
      margin-top: 0.75rem;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .workload-summary {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .workload-summary strong { color: var(--text); }

    .workload-desc em {
      color: var(--text-secondary);
      font-style: normal;
      font-size: 0.78rem;
    }

    .projected-badge {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.15);
      color: var(--pill-running);
      border: 1px solid rgba(251, 191, 36, 0.25);
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>GPU vs TPU Benchmark Results</h1>
      <div class="sub">Live data from <code>make replay</code> → <code>results/{platform}/run_01_replay.json</code></div>
    </div>
    <div class="controls">
      <a href="/advisor" style="color:var(--accent);font-size:0.88rem;font-weight:500;text-decoration:none;margin-right:0.25rem;">Advisor</a>
      <span id="updated" class="pill">loading…</span>
      <button type="button" class="theme-toggle" id="theme" title="Toggle light/dark mode" aria-label="Toggle theme">☀</button>
      <button type="button" id="refresh">Refresh</button>
      <button type="button" class="secondary" id="auto">Auto: ON</button>
    </div>
  </header>

  <main>
    <div class="layout">
      <div class="spec-compare" id="spec-compare">
        <aside class="sidebar" id="sidebar">
          <details class="spec-card gpu" open>
            <summary class="spec-head gpu">
              <span>GPU node pool</span>
              <span class="spec-chevron" aria-hidden="true">▸</span>
            </summary>
            <div id="gpu-specs" class="spec-body">Loading…</div>
          </details>
          <details class="spec-card tpu" open>
            <summary class="spec-head tpu">
              <span>TPU node pool</span>
              <span class="spec-chevron" aria-hidden="true">▸</span>
            </summary>
            <div id="tpu-specs" class="spec-body">Loading…</div>
          </details>
        </aside>
      </div>
      <div class="content">
        <div class="workload-bar">
          <h3>Workload complexity</h3>
          <div class="workload-toggle" id="workload-toggle"></div>
          <div class="workload-desc" id="workload-desc"></div>
          <div class="workload-summary" id="workload-summary"></div>
        </div>
        <div id="compare-bar" class="compare-bar">
          <h3>Head-to-head (same trace)</h3>
          <div id="compare-rows"></div>
        </div>
        <div class="panels" id="panels"></div>
      </div>
    </div>
    <footer>
      Server port <strong>8787</strong>. Data from GCS <code>latest/</code> or local <code>results/</code>.
      <span id="data-source">Source: loading…</span>
    </footer>
  </main>

  <script>
    const panelsEl = document.getElementById('panels');
    const updatedEl = document.getElementById('updated');
    const compareBar = document.getElementById('compare-bar');
    const compareRows = document.getElementById('compare-rows');
    const workloadToggleEl = document.getElementById('workload-toggle');
    const workloadDescEl = document.getElementById('workload-desc');
    const workloadSummaryEl = document.getElementById('workload-summary');
    let autoOn = true;
    let timer = null;
    let currentWorkload = localStorage.getItem('bench-workload') || 'medium';
    let workloadCatalog = [];

    function fmt(n, d = 1) {
      if (n === undefined || n === null || Number.isNaN(Number(n))) return '—';
      return Number(n).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d > 0 ? 0 : d });
    }

    function fmtUsd(n, d = 4) {
      if (n === undefined || n === null || Number.isNaN(Number(n))) return '—';
      const v = Number(n);
      if (v === 0) return '$0';
      if (v >= 1) return '$' + v.toLocaleString(undefined, { maximumFractionDigits: 2 });
      if (v >= 0.0001) return '$' + v.toFixed(d);
      return '$' + v.toExponential(2);
    }

    function metric(k, v, highlight = null) {
      const cls = highlight ? `metric ${highlight}` : 'metric';
      const arrow = highlight === 'tpu-win'
        ? '<span class="indicator" title="Better than GPU">↑</span>'
        : '';
      return `<div class="${cls}"><div class="k">${k}</div><div class="v">${v}${arrow}</div></div>`;
    }

    function metricSection(title) {
      return `<div class="metric-section">${title}</div>`;
    }

    /** Returns true if TPU value beats GPU for this metric key. */
    function tpuBeatsGpu(key, tpuVal, gpuVal) {
      const na = Number(tpuVal), nb = Number(gpuVal);
      if (Number.isNaN(na) || Number.isNaN(nb) || na === nb) return false;
      const higherBetter = new Set([
        'output_tokens_per_second', 'throughput_tok_s', 'requests_per_second',
        'mfu_percent', 'achieved_tflops', 'performance_per_dollar_tok_s', 'performance_per_watt_tok_s',
      ]);
      const lowerBetter = new Set([
        'wall_time_s', 'ttft_p95', 'latency_p95', 'avg_itl',
        'run_cost_usd', 'cost_per_output_token_usd', 'cost_per_wall_second_usd',
        'cost_per_million_output_tokens_usd',
      ]);
      if (higherBetter.has(key)) return na > nb;
      if (lowerBetter.has(key)) return na < nb;
      return false;
    }

    /** TPU panel: green + arrow when TPU wins. GPU panel: red when TPU wins (no arrow). */
    function cmpHighlight(platform, key, myVal, otherVal) {
      if (otherVal === undefined || otherVal === null) return null;
      const tpuWins = platform === 'tpu'
        ? tpuBeatsGpu(key, myVal, otherVal)
        : tpuBeatsGpu(key, otherVal, myVal);
      if (!tpuWins) return null;
      return platform === 'tpu' ? 'tpu-win' : 'gpu-behind';
    }

    function heroIndicator(platform, key, myVal, otherVal) {
      return cmpHighlight(platform, key, myVal, otherVal) === 'tpu-win'
        ? ' <span class="indicator">↑</span>'
        : '';
    }

    function specRow(k, v, unit = '') {
      const display = v === undefined || v === null || v === '' ? '—' : v;
      return `<div class="spec-row"><span class="k">${k}</span><span class="v">${display}${unit && display !== '—' ? ' ' + unit : ''}</span></div>`;
    }

    /** Benchmark defaults — fills sidebar when API/config paths are unavailable. */
    const PLATFORM_DEFAULTS = {
      gpu: {
        infrastructure: 'GPU (H100)',
        node_pool_name: 'gpu-h100-pool',
        node_count: 1,
        accelerator: 'nvidia-h100-80gb',
        accelerator_count: 1,
        machine_type: 'a3-highgpu-1g',
        vcpu: 26,
        system_memory_gib: 234,
        accelerator_memory_gib: 80,
        peak_tflops: 989,
        power_watts: 700,
        interconnect: 'NVLink 4 (900 GBps)',
        network_gbps: 200,
        hourly_cost_usd: 10.60,
        docker_image: 'vllm/vllm-openai:latest',
        framework: 'vllm',
      },
      tpu: {
        infrastructure: 'TPU v6e',
        node_pool_name: 'tpu-v6e-slice-pool',
        node_count: 1,
        accelerator: 'v6e-1',
        accelerator_count: 1,
        machine_type: 'v6e-1x1 (CT6E)',
        vcpu: 44,
        system_memory_gib: 176,
        accelerator_memory_gib: 32,
        peak_tflops: 918,
        power_watts: 300,
        interconnect: 'ICI (800 Gbps/chip)',
        network_gbps: 100,
        hourly_cost_usd: 2.70,
        docker_image: 'vllm/vllm-tpu:latest',
        framework: 'vllm',
      },
    };

    const HW_SPEC_KEYS = [
      'infrastructure', 'accelerator', 'accelerator_count', 'peak_tflops',
      'power_watts', 'hourly_cost_usd', 'machine_type', 'node_pool_name',
      'node_count', 'vcpu', 'system_memory_gib', 'accelerator_memory_gib',
      'interconnect', 'network_gbps', 'docker_image', 'framework',
    ];

    function mergeHardwareEntry(...entries) {
      const out = {};
      for (const key of HW_SPEC_KEYS) {
        for (const e of entries) {
          const v = e?.[key];
          if (v !== undefined && v !== null && v !== '') {
            out[key] = v;
            break;
          }
        }
      }
      return Object.keys(out).length ? out : null;
    }

    /** Pull specs from replay JSON + cost metrics (same source as the main panels). */
    function hardwareFromResults(data) {
      const r = data?.replay;
      if (!r) return null;
      const pc = r.platform_config || {};
      const pool = pc.node_pool || {};
      const hw = r.hardware_utilization || {};
      const cm = data.cost_metrics || r.cost_metrics || {};
      return {
        infrastructure: r.infrastructure,
        docker_image: pc.docker_image,
        framework: pc.framework,
        node_pool_name: pool.name,
        node_count: pool.node_count ?? 1,
        accelerator: pc.accelerator,
        accelerator_count: pc.accelerator_count ?? 1,
        machine_type: pool.machine_type || pc.machine_type,
        vcpu: pool.vcpu,
        system_memory_gib: pool.system_memory_gib,
        accelerator_memory_gib: pool.accelerator_memory_gib,
        peak_tflops: hw.peak_tflops ?? pc.peak_tflops,
        power_watts: cm.power_watts ?? pool.power_watts ?? pc.power_watts,
        interconnect: pool.interconnect || pool.topology,
        network_gbps: pool.network_gbps,
        hourly_cost_usd: cm.hourly_cost_usd,
      };
    }

    function hardwareFromMigration(migRes) {
      const build = (platform) => {
        const m = migRes?.[platform];
        if (!m) return null;
        const p = m.node_pool || {};
        if (!p.name && !m.accelerator && !m.machine_type) return null;
        return {
          node_pool_name: p.name,
          node_count: p.node_count ?? 1,
          accelerator: m.accelerator,
          accelerator_count: m.accelerator_count ?? 1,
          machine_type: p.machine_type || m.machine_type,
          vcpu: p.vcpu,
          system_memory_gib: p.system_memory_gib,
          accelerator_memory_gib: p.accelerator_memory_gib,
          peak_tflops: m.peak_tflops,
          power_watts: p.power_watts ?? m.power_watts,
          interconnect: p.interconnect || p.topology,
          network_gbps: p.network_gbps,
          hourly_cost_usd: null,
          docker_image: m.docker_image,
          framework: m.framework,
        };
      };
      return { gpu: build('gpu'), tpu: build('tpu') };
    }

    function embeddedBootData() {
      const el = document.getElementById('embedded-hardware-specs');
      if (!el) return {};
      try {
        return JSON.parse(el.textContent);
      } catch {
        return {};
      }
    }

    function embeddedHardware() {
      const boot = embeddedBootData();
      return boot.hardware || boot;
    }

    function resolveAllHardware(gpuRes, tpuRes, hwRes, migRes) {
      const embedded = embeddedHardware();
      const migBuilt = hardwareFromMigration(migRes);
      const build = (platform, data) => mergeHardwareEntry(
        hardwareFromResults(data),
        embedded?.[platform],
        hwRes?.[platform],
        migRes?.hardware?.[platform],
        migBuilt?.[platform],
        PLATFORM_DEFAULTS[platform],
      );
      return { gpu: build('gpu', gpuRes), tpu: build('tpu', tpuRes) };
    }

    function renderHardwareSpecs(hardware) {
      const render = (platform, elId) => {
        const h = hardware?.[platform] || PLATFORM_DEFAULTS[platform];
        const el = document.getElementById(elId);
        el.innerHTML = [
          specRow('Infrastructure', h.infrastructure),
          specRow('Accelerator', h.accelerator),
          specRow('Chips / node', h.accelerator_count),
          specRow('Peak compute', h.peak_tflops, 'TFLOPS'),
          specRow('Power (TDP)', h.power_watts, 'W'),
          specRow('Hourly cost', h.hourly_cost_usd != null ? '$' + Number(h.hourly_cost_usd).toFixed(2) : null),
          specRow('Machine type', h.machine_type),
          specRow('Pool name', h.node_pool_name),
          specRow('vCPU', h.vcpu),
          specRow('System memory', h.system_memory_gib, 'GiB'),
          specRow('Accel memory', h.accelerator_memory_gib, 'GiB'),
          specRow('Interconnect', h.interconnect),
          specRow('Network', h.network_gbps, 'Gbps'),
          specRow('Framework', h.framework),
          specRow('Image', h.docker_image),
        ].join('');
      };
      render('gpu', 'gpu-specs');
      render('tpu', 'tpu-specs');
    }

    function renderServingBlock(r) {
      const pc = r.platform_config;
      if (!pc) return '';
      const img = pc.docker_image || '—';
      const args = (pc.vllm_args || []).slice(0, 6).join(' ');
      const accel = pc.accelerator || pc.generation || '—';
      return `
        <div class="serving-block">
          <strong>Serving config</strong> (${pc.platform || '—'})<br>
          Image: <code>${img}</code><br>
          Accelerator: ${accel}<br>
          vLLM: <code>${args}${(pc.vllm_args || []).length > 6 ? ' …' : ''}</code>
        </div>`;
    }

    function workloadMeta(tierId) {
      return workloadCatalog.find(w => w.id === tierId) || { id: tierId, label: tierId };
    }

    function buildWorkloadToggle() {
      if (!workloadCatalog.length) return;
      workloadToggleEl.innerHTML = workloadCatalog.map(w => `
        <button type="button" class="workload-btn${w.id === currentWorkload ? ' active' : ''}" data-tier="${w.id}">
          ${w.label}
        </button>
      `).join('');
      updateWorkloadDesc();
    }

    function updateWorkloadToggleActive() {
      workloadToggleEl.querySelectorAll('.workload-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tier === currentWorkload);
      });
      updateWorkloadDesc();
    }

    function updateWorkloadDesc() {
      const w = workloadMeta(currentWorkload);
      workloadDescEl.innerHTML = [
        w.description || '',
        w.analogy ? `<br><em>Analogy: ${w.analogy}</em>` : '',
        w.num_prompts ? `<br><em>${w.num_prompts} prompts · ${w.input_tokens} in / ${w.output_tokens} out tok</em>` : '',
      ].join('');
    }

    if (!workloadToggleEl.dataset.bound) {
      workloadToggleEl.dataset.bound = '1';
      workloadToggleEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.workload-btn');
        if (!btn || btn.dataset.tier === currentWorkload) return;
        const prev = currentWorkload;
        currentWorkload = btn.dataset.tier;
        localStorage.setItem('bench-workload', currentWorkload);
        // #region agent log
        dbg('H1', 'index.html:toggle', 'tier click', { prev, next: currentWorkload });
        // #endregion
        updateWorkloadToggleActive();
        load({ force: true });
      });
    }

    function renderWorkloadToggle() {
      buildWorkloadToggle();
    }

    async function initWorkloads() {
      const boot = embeddedBootData();
      if (boot.workloads?.length) {
        workloadCatalog = boot.workloads;
        if (boot.default_workload) currentWorkload = localStorage.getItem('bench-workload') || boot.default_workload;
      } else {
        try {
          const res = await fetch('/api/workloads').then(r => r.json());
          workloadCatalog = res.tiers || [];
          currentWorkload = localStorage.getItem('bench-workload') || res.default || 'medium';
        } catch {
          workloadCatalog = [
            { id: 'small', label: 'Simple', description: 'Low-volume inference' },
            { id: 'medium', label: 'Medium', description: 'Steady batch inference' },
            { id: 'high', label: 'Complex', description: 'Heavy sustained load' },
          ];
        }
      }
      renderWorkloadToggle();
    }

    let loadSeq = 0;
    let loadInFlight = false;
    let loadQueued = false;
    let lastStatusRes = {};

    // #region agent log
    function dbg(hypothesisId, location, message, data) {
      fetch('/api/debug/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ hypothesisId, location, message, data: data || {}, sessionId: 'aebf56' }),
      }).catch(() => {});
    }
    // #endregion

    function resultsUrl(platform, tier) {
      const w = tier || currentWorkload;
      return `/api/results/${platform}?workload=${encodeURIComponent(w)}&_=${Date.now()}`;
    }

    function renderPanel(platform, data, otherData) {
      const r = data.replay;
      const other = otherData?.replay;
      const cm = data.cost_metrics || r?.cost_metrics || {};
      const otherCm = otherData?.cost_metrics || other?.cost_metrics || {};
      const headClass = platform;
      const label = platform.toUpperCase();

      if (!data.has_replay) {
        const status = data.is_running ? 'running' : 'missing';
        const tier = data.requested_tier || data.workload_tier || currentWorkload;
        const avail = (data.available_tiers || []).join(', ') || 'none';
        const gcsErr = data.gcs_error || window.__gcsError;
        const msg = data.is_running
          ? 'Replay in progress… (reading live.json)'
          : gcsErr
            ? `<strong>GCS read failed</strong> — metrics exist in the bucket but this machine cannot authenticate.<br>`
              + `<code>${String(gcsErr).slice(0, 300)}</code><br>`
              + `Fix: run <code>make check-gcs</code> — on Cloud Shell do <em>not</em> run gcloud auth application-default login`
            : `No <strong>${tier}</strong> replay for ${platform.toUpperCase()}.<br>`
              + `Run:<br><code>make replay TARGET=http://127.0.0.1:8000 PLATFORM=${platform} TIER=${tier} MODEL='Qwen/Qwen2.5-0.5B-Instruct'</code>`
              + `<br><span style="font-size:0.8rem">Measured tiers for ${platform}: ${avail}</span>`;
        return `
          <div class="panel ${headClass}">
            <div class="panel-head ${headClass}"><h2>${label}</h2><span class="pill ${status}">${status}</span></div>
            <div class="empty">${msg}</div>
          </div>`;
      }

      const hw = r.hardware_utilization || {};
      const srv = r.server_metrics || {};
      const ttft = r.ttft_ms || {};
      const lat = r.latency_ms || {};
      const itl = r.itl_ms || {};
      const failed = (r.failed_requests || 0) > 0 && (r.successful_requests || 0) === 0;
      const status = data.is_running ? 'running' : (failed ? 'failed' : 'complete');
      const errBlock = (() => {
        const es = r.error_summary;
        if (!es?.top_errors?.length) {
          if (failed) {
            return `<div class="error-banner"><strong>All requests failed.</strong> Re-run replay and check the terminal for error details, or inspect <code>results/${platform}/run_01_replay.json</code>.</div>`;
          }
          return '';
        }
        const items = es.top_errors.slice(0, 3).map(e =>
          `<li><code>${String(e.error).slice(0, 200)}</code> (${e.count}x)</li>`
        ).join('');
        return `<div class="error-banner"><strong>All ${es.total_failures} requests failed</strong> — metrics are zero until replay succeeds.<ul class="error-list">${items}</ul></div>`;
      })();

      const requestedTier = data.requested_tier || currentWorkload;
      const measuredTier = r?.benchmark_contract?.workload_tier || r?.workload_tier || data.workload_tier;
      const tierLabel = workloadMeta(requestedTier).label || requestedTier;
      const tierMismatch = measuredTier && requestedTier && measuredTier !== requestedTier;
      const projectedBadge = data.projected
        ? `<span class="projected-badge" title="Estimated from ${r?.projected_from_tier || 'measured'} replay — run make replay TIER=${requestedTier} for real numbers">Projected · ${tierLabel}</span>`
        : tierMismatch
          ? `<span class="projected-badge" style="background:rgba(251,191,36,0.12);color:#fbbf24;border-color:rgba(251,191,36,0.25)" title="Replay tier ${measuredTier} ≠ requested ${requestedTier}">Tier mismatch</span>`
          : `<span class="projected-badge" style="background:rgba(74,222,128,0.12);color:var(--tpu-bright);border-color:rgba(74,222,128,0.25)" title="${data.replay_path || ''}">Measured · ${tierLabel}</span>`;

      return `
        <div class="panel ${headClass}">
          <div class="panel-head ${headClass}">
            <h2>${label}${projectedBadge}</h2>
            <span class="pill ${status}">${status}</span>
          </div>
          ${errBlock}
          <div class="hero ${headClass}${cmpHighlight(platform, 'output_tokens_per_second', r.output_tokens_per_second, other?.output_tokens_per_second) === 'tpu-win' ? ' tpu-win' : ''}">
            <div class="big">${fmt(r.output_tokens_per_second, 1)}${heroIndicator(platform, 'output_tokens_per_second', r.output_tokens_per_second, other?.output_tokens_per_second)}</div>
            <div class="label">output tokens / sec / chip</div>
          </div>
          <div class="grid">
            ${metricSection('Performance')}
            ${metric('Model', r.model || '—')}
            ${metric('Infrastructure', r.infrastructure || '—')}
            ${metric('Wall time', fmt(r.wall_time_s, 2) + ' s', cmpHighlight(platform, 'wall_time_s', r.wall_time_s, other?.wall_time_s))}
            ${metric('Requests', `${r.successful_requests ?? '—'} ok / ${r.failed_requests ?? 0} err`)}
            ${metric('Throughput (RPS)', fmt(r.requests_per_second, 2), cmpHighlight(platform, 'requests_per_second', r.requests_per_second, other?.requests_per_second))}
            ${metric('Generated tokens', fmt(r.total_generated_tokens, 0))}
            ${metric('Input tokens', fmt(r.total_input_tokens, 0))}
            ${metric('Total throughput', fmt(r.throughput_tok_s, 1) + ' tok/s', cmpHighlight(platform, 'throughput_tok_s', r.throughput_tok_s, other?.throughput_tok_s))}
            ${metric('TTFT p50', fmt(ttft.p50, 1) + ' ms')}
            ${metric('TTFT p95', fmt(ttft.p95, 1) + ' ms', cmpHighlight(platform, 'ttft_p95', ttft.p95, other?.ttft_ms?.p95))}
            ${metric('TTFT p99', fmt(ttft.p99, 1) + ' ms')}
            ${metric('Latency p95', fmt(lat.p95, 1) + ' ms', cmpHighlight(platform, 'latency_p95', lat.p95, other?.latency_ms?.p95))}
            ${metric('Avg duration', fmt(lat.avg, 1) + ' ms')}
            ${metric('Avg ITL', fmt(itl.avg, 2) + ' ms', cmpHighlight(platform, 'avg_itl', itl.avg, other?.itl_ms?.avg))}
            ${metric('ITL p95', fmt(itl.p95, 2) + ' ms')}
            ${metric('MFU', fmt(hw.mfu_percent, 2) + '%', cmpHighlight(platform, 'mfu_percent', hw.mfu_percent, other?.hardware_utilization?.mfu_percent))}
            ${metric('Achieved TFLOPS', fmt(hw.achieved_tflops, 4), cmpHighlight(platform, 'achieved_tflops', hw.achieved_tflops, other?.hardware_utilization?.achieved_tflops))}
            ${metric('Peak TFLOPS', fmt(hw.peak_tflops, 0))}
            ${metricSection('Cost & energy')}
            ${metric('Hourly rate', fmtUsd(cm.hourly_cost_usd, 2) + '/hr')}
            ${metric('Run cost', fmtUsd(cm.run_cost_usd), cmpHighlight(platform, 'run_cost_usd', cm.run_cost_usd, otherCm.run_cost_usd))}
            ${metric('Cost / output token', fmtUsd(cm.cost_per_output_token_usd, 6), cmpHighlight(platform, 'cost_per_output_token_usd', cm.cost_per_output_token_usd, otherCm.cost_per_output_token_usd))}
            ${metric('Cost / wall second', fmtUsd(cm.cost_per_wall_second_usd, 4), cmpHighlight(platform, 'cost_per_wall_second_usd', cm.cost_per_wall_second_usd, otherCm.cost_per_wall_second_usd))}
            ${metric('Cost / 1M out tokens', fmtUsd(cm.cost_per_million_output_tokens_usd, 2), cmpHighlight(platform, 'cost_per_million_output_tokens_usd', cm.cost_per_million_output_tokens_usd, otherCm.cost_per_million_output_tokens_usd))}
            ${metric('Perf / $', fmt(cm.performance_per_dollar_tok_s, 1) + ' tok/s/$', cmpHighlight(platform, 'performance_per_dollar_tok_s', cm.performance_per_dollar_tok_s, otherCm.performance_per_dollar_tok_s))}
            ${metric('Perf / watt', fmt(cm.performance_per_watt_tok_s, 2) + ' tok/s/W', cmpHighlight(platform, 'performance_per_watt_tok_s', cm.performance_per_watt_tok_s, otherCm.performance_per_watt_tok_s))}
            ${metric('Power (TDP est.)', fmt(cm.power_watts, 0) + ' W')}
            ${metricSection('Server')}
            ${metric('KV cache peak', fmt(srv.peak_kv_cache_usage_pct, 2) + '%')}
            ${metric('Prefix hit rate', fmt(srv.prefix_cache_hit_rate_pct, 1) + '%')}
            ${metric('Prefix hits', fmt(srv.prefix_cache_hits, 0))}
            ${metric('Peak queued', fmt(srv.peak_queued_requests, 1))}
            ${metric('Peak running', fmt(srv.peak_running_requests, 1))}
          </div>
          ${renderServingBlock(r)}
        </div>`;
    }

    function renderCompare(tpu, gpu) {
      if (!tpu?.has_replay || !gpu?.has_replay) {
        compareBar.classList.remove('visible');
        return;
      }
      const a = gpu.replay;
      const b = tpu.replay;
      const ca = gpu.cost_metrics || a?.cost_metrics || {};
      const cb = tpu.cost_metrics || b?.cost_metrics || {};
      const rows = [
        ['Output tok/s/chip', a.output_tokens_per_second, b.output_tokens_per_second, true],
        ['TTFT p95 (ms)', a.ttft_ms?.p95, b.ttft_ms?.p95, false],
        ['Latency p95 (ms)', a.latency_ms?.p95, b.latency_ms?.p95, false],
        ['MFU %', a.hardware_utilization?.mfu_percent, b.hardware_utilization?.mfu_percent, true],
        ['Wall time (s)', a.wall_time_s, b.wall_time_s, false],
        ['Run cost ($)', ca.run_cost_usd, cb.run_cost_usd, false],
        ['Cost / output token', ca.cost_per_output_token_usd, cb.cost_per_output_token_usd, false],
        ['Perf / watt (tok/s/W)', ca.performance_per_watt_tok_s, cb.performance_per_watt_tok_s, true],
        ['Perf / $ (tok/s/$)', ca.performance_per_dollar_tok_s, cb.performance_per_dollar_tok_s, true],
      ];
      compareRows.innerHTML = rows.map(([label, gpuVal, tpuVal, higherBetter]) => {
        const ng = Number(gpuVal), nt = Number(tpuVal);
        let win = '—';
        let winCls = '';
        if (!Number.isNaN(ng) && !Number.isNaN(nt) && ng !== nt) {
          const gpuWins = higherBetter ? ng > nt : ng < nt;
          win = gpuWins ? '↑ GPU' : '↑ TPU';
          winCls = gpuWins ? 'gpu-win' : 'tpu-win';
        }
        const fmtVal = (v) => label.includes('$') || label.includes('Cost') ? fmtUsd(v, 6) : fmt(v);
        return `<div class="compare-row"><span>${label}</span><span><span style="color:var(--gpu)">GPU ${fmtVal(gpuVal)}</span> · <span style="color:var(--tpu)">TPU ${fmtVal(tpuVal)}</span> <span class="winner ${winCls}">${win !== '—' ? win : ''}</span></span></div>`;
      }).join('');
      compareBar.classList.add('visible');
    }

    function renderComplexitySummary(tpu, gpu, tier) {
      const meta = workloadMeta(tier);
      if (!tpu?.has_replay || !gpu?.has_replay) {
        workloadSummaryEl.textContent = `${meta.label} workload — run both platforms to see a head-to-head summary.`;
        return;
      }

      const a = gpu.replay, b = tpu.replay;
      const ca = gpu.cost_metrics || a?.cost_metrics || {};
      const cb = tpu.cost_metrics || b?.cost_metrics || {};
      const aTok = Number(a.output_tokens_per_second), bTok = Number(b.output_tokens_per_second);
      const aCost = Number(ca.cost_per_output_token_usd), bCost = Number(cb.cost_per_output_token_usd);

      if (!aTok || !bTok || !aCost || !bCost) {
        workloadSummaryEl.textContent = `${meta.label} workload — incomplete metrics for a summary.`;
        return;
      }

      const throughputWinner = aTok > bTok ? 'GPU' : 'TPU';
      const throughputGap = Math.abs(aTok - bTok) / Math.min(aTok, bTok) * 100;
      const costWinner = aCost < bCost ? 'GPU' : 'TPU';
      const costGap = Math.abs(aCost - bCost) / Math.max(aCost, bCost) * 100;

      workloadSummaryEl.innerHTML = `For a <strong>${meta.label}</strong> workload, ` +
        `<strong>${throughputWinner}</strong> is ${fmt(throughputGap, 0)}% faster (tok/s), ` +
        `and <strong>${costWinner}</strong> is ${fmt(costGap, 0)}% cheaper per output token. ` +
        (throughputWinner === costWinner
          ? `<strong>${throughputWinner}</strong> wins on both.`
          : `Trade-off: pick <strong>${throughputWinner}</strong> for speed, <strong>${costWinner}</strong> for cost.`);
    }

    async function pollStatus() {
      try {
        lastStatusRes = await fetch('/api/status').then(r => r.json());
        window.__gcsError = lastStatusRes.gcs_error || null;
      } catch {
        /* keep previous status snapshot */
      }
    }

    async function load(options = {}) {
      const force = options.force === true;
      if (loadInFlight) {
        if (force) loadQueued = true;
        return;
      }
      loadInFlight = true;
      try {
        do {
          loadQueued = false;
          const seq = ++loadSeq;
          const tier = currentWorkload;
          // #region agent log
          dbg('H2', 'index.html:load', 'load start', { seq, tier, force });
          // #endregion
          try {
            const [tpuRes, gpuRes, migRes, hwRes] = await Promise.all([
              fetch(resultsUrl('tpu', tier)).then(r => r.json()),
              fetch(resultsUrl('gpu', tier)).then(r => r.json()),
              fetch('/api/migration').then(r => r.json()),
              fetch('/api/hardware').then(r => r.ok ? r.json() : null).catch(() => null),
            ]);
            const statusRes = lastStatusRes;
            if (seq !== loadSeq) {
              // #region agent log
              dbg('H2', 'index.html:load', 'stale response discarded', { seq, currentLoadSeq: loadSeq, tier });
              // #endregion
              continue;
            }
            // #region agent log
            dbg('H4', 'index.html:load', 'load complete', {
              seq,
              tier,
              tpuTok: tpuRes.replay?.output_tokens_per_second,
              gpuTok: gpuRes.replay?.output_tokens_per_second,
              tpuReq: tpuRes.replay?.successful_requests,
              gpuReq: gpuRes.replay?.successful_requests,
              tpuPath: tpuRes.replay_path,
              gpuPath: gpuRes.replay_path,
            });
            // #endregion
            updateWorkloadToggleActive();
            window.__gcsError = statusRes.gcs_error || null;
            panelsEl.innerHTML = renderPanel('gpu', gpuRes, tpuRes) + renderPanel('tpu', tpuRes, gpuRes);
            renderCompare(tpuRes, gpuRes);
            renderComplexitySummary(tpuRes, gpuRes, tier);
            renderHardwareSpecs(resolveAllHardware(gpuRes, tpuRes, hwRes, migRes));
            const src = statusRes.data_source || statusRes.results_source || 'local';
            const gcsErr = statusRes.gcs_error;
            const bucket = statusRes.gcs_bucket ? `gs://${statusRes.gcs_bucket}/${statusRes.gcs_prefix || 'latest'}` : '';
            const manifestAt = statusRes.manifest?.updated_at;
            const availTpu = (tpuRes.available_tiers || []).join(', ') || 'none';
            const availGpu = (gpuRes.available_tiers || []).join(', ') || 'none';
            const tpuSrc = tpuRes.replay_source || statusRes.tier_sources?.tpu?.[tier] || '—';
            const gpuSrc = gpuRes.replay_source || statusRes.tier_sources?.gpu?.[tier] || '—';
            const tpuPath = tpuRes.replay_path || '';
            const tpuTok = tpuRes.replay?.output_tokens_per_second;
            const gpuTok = gpuRes.replay?.output_tokens_per_second;
            document.getElementById('data-source').textContent =
              (gcsErr ? `GCS ERROR: ${gcsErr} · ` : '')
              + `Source: ${src}${bucket ? ' · ' + bucket : ''}${manifestAt ? ' · updated ' + manifestAt : ''}`
              + ` · tier: ${tier}${tpuTok != null ? ' · tpu ' + fmt(tpuTok, 1) + ' out tok/s/chip' : ''}${gpuTok != null ? ' · gpu ' + fmt(gpuTok, 1) + ' out tok/s/chip' : ''}`
              + ` · tpu: ${tpuSrc} (${availTpu}) · gpu: ${gpuSrc} (${availGpu})`
              + `${tpuPath ? ' · ' + tpuPath.split('/').slice(-4).join('/') : ''}`;
            updatedEl.textContent = 'updated ' + new Date().toLocaleTimeString();
            updatedEl.className = 'pill';
          } catch (e) {
            // #region agent log
            dbg('H4', 'index.html:load', 'load error', { seq, tier, error: String(e) });
            // #endregion
            updatedEl.textContent = 'fetch error';
            updatedEl.className = 'pill missing';
          }
        } while (loadQueued);
      } finally {
        loadInFlight = false;
      }
    }

    document.getElementById('refresh').onclick = load;
    document.getElementById('auto').onclick = () => {
      autoOn = !autoOn;
      document.getElementById('auto').textContent = 'Auto: ' + (autoOn ? 'ON' : 'OFF');
      if (autoOn) startAuto(); else clearInterval(timer);
    };

    function startAuto() {
      clearInterval(timer);
      timer = setInterval(() => load(), 10000);
    }

    let statusTimer = null;
    function startStatusPoll() {
      clearInterval(statusTimer);
      statusTimer = setInterval(pollStatus, 30000);
    }

    const themeBtn = document.getElementById('theme');
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('bench-ui-theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀' : '☾';
      themeBtn.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    }
    applyTheme(localStorage.getItem('bench-ui-theme') || 'dark');
    themeBtn.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    };

    renderHardwareSpecs({ gpu: PLATFORM_DEFAULTS.gpu, tpu: PLATFORM_DEFAULTS.tpu });

    initWorkloads().then(async () => {
      await pollStatus();
      load();
      startAuto();
      startStatusPoll();
    });
  </script>
</body>
</html>
