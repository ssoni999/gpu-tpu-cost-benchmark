<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPU vs TPU Benchmark Results</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --border: #dfe3ea;
      --text: #1a1d24;
      --muted: #5c6578;
      --gpu: #d93025;
      --gpu-light: #fce8e6;
      --tpu: #137333;
      --tpu-light: #e6f4ea;
      --win: #137333;
      --accent: #174ea6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; }
    .controls { display: flex; gap: 0.5rem; align-items: center; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .pill {
      font-size: 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: #e8f0fe;
      color: var(--tpu);
    }
    .pill.running { background: #fef7e0; color: #b06000; }
    .pill.missing { background: #fce8e6; color: #c5221f; }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }
    main { max-width: 1400px; margin: 0 auto; padding: 1.25rem 1.5rem 2.5rem; }
    .sidebar { display: flex; flex-direction: column; gap: 1rem; }
    .spec-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .spec-card.gpu { border-top: 3px solid var(--gpu); }
    .spec-card.tpu { border-top: 3px solid var(--tpu); }
    .spec-head {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .spec-head.gpu { color: var(--gpu); background: var(--gpu-light); }
    .spec-head.tpu { color: var(--tpu); background: var(--tpu-light); }
    .spec-row {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
    }
    .spec-row:last-child { border-bottom: none; }
    .spec-row .k { color: var(--muted); }
    .spec-row .v { font-weight: 600; text-align: right; }
    .content { min-width: 0; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 800px) { .panels { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .panel.gpu { border-top: 3px solid var(--gpu); }
    .panel.tpu { border-top: 3px solid var(--tpu); }
    .panel-head {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-head h2 { margin: 0; font-size: 0.95rem; }
    .panel-head.tpu h2 { color: var(--tpu); }
    .panel-head.gpu h2 { color: var(--gpu); }
    .hero.gpu .big { color: var(--gpu); }
    .hero.tpu .big { color: var(--tpu); }
    .hero {
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .hero .big { font-size: 2rem; font-weight: 700; }
    .hero .label { color: var(--muted); font-size: 0.8rem; margin-top: 0.25rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .metric {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .metric:nth-child(2n) { border-right: none; }
    .metric .k { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .metric .v { font-size: 1.05rem; font-weight: 600; margin-top: 0.15rem; }
    .metric.tpu-win .v { color: var(--tpu); }
    .metric.gpu-behind .v { color: var(--gpu); }
    .metric.tpu-win .indicator,
    .hero.tpu-win .indicator {
      display: inline-block;
      margin-left: 0.25rem;
      font-size: 0.85rem;
      color: var(--tpu);
      font-weight: 700;
    }
    .metric-section {
      grid-column: 1 / -1;
      padding: 0.5rem 1rem;
      background: #f8f9fb;
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    section.block { margin-top: 1.25rem; }
    section.block h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }
    .empty {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .empty code { font-size: 0.82rem; }
    footer {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .compare-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: none;
    }
    .compare-bar.visible { display: block; }
    .compare-row { display: flex; justify-content: space-between; padding: 0.35rem 0; font-size: 0.9rem; }
    .compare-row .winner { font-weight: 600; }
    .compare-row .winner.tpu-win { color: var(--tpu); }
    .compare-row .winner.gpu-win { color: var(--gpu); }
    .error-banner {
      background: #fce8e6;
      border: 1px solid #f5c6c2;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }
    .error-banner strong { color: #c5221f; }
    .error-banner code { font-size: 0.8rem; }
    .error-list { margin: 0.5rem 0 0; padding-left: 1.2rem; }
    .pill.failed { background: #fce8e6; color: #c5221f; }
    .migration-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .migration-bar h3 { margin: 0 0 0.75rem; font-size: 0.85rem; }
    .migration-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .migration-table th, .migration-table td {
      text-align: left;
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .migration-table th { color: var(--muted); font-weight: 500; }
    .migration-table .diff { background: #fef7e0; }
    .serving-block {
      padding: 0.65rem 1rem 0.85rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
    }
    .serving-block code { font-size: 0.72rem; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>GPU vs TPU Benchmark Results</h1>
      <div class="sub">Live data from <code>make replay</code> → <code>results/{platform}/run_01_replay.json</code></div>
    </div>
    <div class="controls">
      <span id="updated" class="pill">loading…</span>
      <button type="button" id="refresh">Refresh</button>
      <button type="button" class="secondary" id="auto">Auto: ON</button>
    </div>
  </header>

  <main>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="spec-card gpu">
          <div class="spec-head gpu">GPU node pool</div>
          <div id="gpu-specs">Loading…</div>
        </div>
        <div class="spec-card tpu">
          <div class="spec-head tpu">TPU node pool</div>
          <div id="tpu-specs">Loading…</div>
        </div>
      </aside>
      <div class="content">
        <div id="compare-bar" class="compare-bar">
          <h3 style="margin:0 0 0.5rem;font-size:0.85rem">Head-to-head (same trace)</h3>
          <div id="compare-rows"></div>
        </div>
        <div class="panels" id="panels"></div>
      </div>
    </div>
    <footer>
      Server port <strong>8787</strong>. Data from GCS <code>latest/</code> or local <code>results/</code>.
      <span id="data-source">Source: loading…</span>
    </footer>
  </main>

  <script>
    const panelsEl = document.getElementById('panels');
    const updatedEl = document.getElementById('updated');
    const compareBar = document.getElementById('compare-bar');
    const compareRows = document.getElementById('compare-rows');
    let autoOn = true;
    let timer = null;

    function fmt(n, d = 1) {
      if (n === undefined || n === null || Number.isNaN(Number(n))) return '—';
      return Number(n).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d > 0 ? 0 : d });
    }

    function fmtUsd(n, d = 4) {
      if (n === undefined || n === null || Number.isNaN(Number(n))) return '—';
      const v = Number(n);
      if (v === 0) return '$0';
      if (v >= 1) return '$' + v.toLocaleString(undefined, { maximumFractionDigits: 2 });
      if (v >= 0.0001) return '$' + v.toFixed(d);
      return '$' + v.toExponential(2);
    }

    function metric(k, v, highlight = null) {
      const cls = highlight ? `metric ${highlight}` : 'metric';
      const arrow = highlight === 'tpu-win'
        ? '<span class="indicator" title="Better than GPU">↑</span>'
        : '';
      return `<div class="${cls}"><div class="k">${k}</div><div class="v">${v}${arrow}</div></div>`;
    }

    function metricSection(title) {
      return `<div class="metric-section">${title}</div>`;
    }

    /** Returns true if TPU value beats GPU for this metric key. */
    function tpuBeatsGpu(key, tpuVal, gpuVal) {
      const na = Number(tpuVal), nb = Number(gpuVal);
      if (Number.isNaN(na) || Number.isNaN(nb) || na === nb) return false;
      const higherBetter = new Set([
        'output_tokens_per_second', 'throughput_tok_s', 'requests_per_second',
        'mfu_percent', 'achieved_tflops', 'performance_per_dollar_tok_s', 'performance_per_watt_tok_s',
      ]);
      const lowerBetter = new Set([
        'wall_time_s', 'ttft_p95', 'latency_p95', 'avg_itl',
        'run_cost_usd', 'cost_per_output_token_usd', 'cost_per_wall_second_usd',
        'cost_per_million_output_tokens_usd',
      ]);
      if (higherBetter.has(key)) return na > nb;
      if (lowerBetter.has(key)) return na < nb;
      return false;
    }

    /** TPU panel: green + arrow when TPU wins. GPU panel: red when TPU wins (no arrow). */
    function cmpHighlight(platform, key, myVal, otherVal) {
      if (otherVal === undefined || otherVal === null) return null;
      const tpuWins = platform === 'tpu'
        ? tpuBeatsGpu(key, myVal, otherVal)
        : tpuBeatsGpu(key, otherVal, myVal);
      if (!tpuWins) return null;
      return platform === 'tpu' ? 'tpu-win' : 'gpu-behind';
    }

    function heroIndicator(platform, key, myVal, otherVal) {
      return cmpHighlight(platform, key, myVal, otherVal) === 'tpu-win'
        ? ' <span class="indicator">↑</span>'
        : '';
    }

    function specRow(k, v, unit = '') {
      const display = v === undefined || v === null || v === '' ? '—' : v;
      return `<div class="spec-row"><span class="k">${k}</span><span class="v">${display}${unit && display !== '—' ? ' ' + unit : ''}</span></div>`;
    }

    function hardwareFromMigration(migRes) {
      const build = (platform) => {
        const m = migRes?.[platform];
        if (!m) return null;
        const p = m.node_pool || {};
        if (!p.name && !m.accelerator && !m.machine_type) return null;
        return {
          node_pool_name: p.name,
          node_count: p.node_count ?? 1,
          accelerator: m.accelerator,
          accelerator_count: m.accelerator_count ?? 1,
          machine_type: p.machine_type || m.machine_type,
          vcpu: p.vcpu,
          system_memory_gib: p.system_memory_gib,
          accelerator_memory_gib: p.accelerator_memory_gib,
          peak_tflops: m.peak_tflops,
          power_watts: p.power_watts ?? m.power_watts,
          interconnect: p.interconnect || p.topology,
          network_gbps: p.network_gbps,
          hourly_cost_usd: null,
        };
      };
      return { gpu: build('gpu'), tpu: build('tpu') };
    }

    function resolveHardware(hwRes, migRes) {
      if (hwRes?.gpu?.node_pool_name || hwRes?.gpu?.accelerator) return hwRes;
      if (migRes?.hardware?.gpu) return migRes.hardware;
      return hardwareFromMigration(migRes);
    }

    function renderHardwareSpecs(hardware) {
      const render = (platform, elId) => {
        const h = hardware?.[platform];
        const el = document.getElementById(elId);
        if (!h) {
          el.innerHTML = '<div class="spec-row"><span class="k">Status</span><span class="v">Restart UI: git pull && make ui</span></div>';
          return;
        }
        el.innerHTML = [
          specRow('Pool name', h.node_pool_name),
          specRow('Nodes', h.node_count),
          specRow('Accelerator', h.accelerator),
          specRow('Chips / node', h.accelerator_count),
          specRow('Machine type', h.machine_type),
          specRow('vCPU', h.vcpu),
          specRow('System memory', h.system_memory_gib, 'GiB'),
          specRow('Accel memory', h.accelerator_memory_gib, 'GiB'),
          specRow('Peak compute', h.peak_tflops, 'TFLOPS'),
          specRow('Power (TDP)', h.power_watts, 'W'),
          specRow('Interconnect', h.interconnect),
          specRow('Network', h.network_gbps, 'Gbps'),
          specRow('Hourly cost', h.hourly_cost_usd != null ? '$' + Number(h.hourly_cost_usd).toFixed(2) : null),
        ].join('');
      };
      render('gpu', 'gpu-specs');
      render('tpu', 'tpu-specs');
    }

    function renderServingBlock(r) {
      const pc = r.platform_config;
      if (!pc) return '';
      const img = pc.docker_image || '—';
      const args = (pc.vllm_args || []).slice(0, 6).join(' ');
      const accel = pc.accelerator || pc.generation || '—';
      return `
        <div class="serving-block">
          <strong>Serving config</strong> (${pc.platform || '—'})<br>
          Image: <code>${img}</code><br>
          Accelerator: ${accel}<br>
          vLLM: <code>${args}${(pc.vllm_args || []).length > 6 ? ' …' : ''}</code>
        </div>`;
    }

    function renderPanel(platform, data, otherData) {
      const r = data.replay;
      const other = otherData?.replay;
      const cm = data.cost_metrics || r?.cost_metrics || {};
      const otherCm = otherData?.cost_metrics || other?.cost_metrics || {};
      const headClass = platform;
      const label = platform.toUpperCase();

      if (!data.has_replay) {
        const status = data.is_running ? 'running' : 'missing';
        const msg = data.is_running
          ? 'Replay in progress… (reading live.json)'
          : `No results yet. Run:<br><code>make replay TARGET=http://127.0.0.1:8000 PLATFORM=${platform} MODEL='…'</code>`;
        return `
          <div class="panel ${headClass}">
            <div class="panel-head ${headClass}"><h2>${label}</h2><span class="pill ${status}">${status}</span></div>
            <div class="empty">${msg}</div>
          </div>`;
      }

      const hw = r.hardware_utilization || {};
      const srv = r.server_metrics || {};
      const ttft = r.ttft_ms || {};
      const lat = r.latency_ms || {};
      const itl = r.itl_ms || {};
      const failed = (r.failed_requests || 0) > 0 && (r.successful_requests || 0) === 0;
      const status = data.is_running ? 'running' : (failed ? 'failed' : 'complete');
      const errBlock = (() => {
        const es = r.error_summary;
        if (!es?.top_errors?.length) {
          if (failed) {
            return `<div class="error-banner"><strong>All requests failed.</strong> Re-run replay and check the terminal for error details, or inspect <code>results/${platform}/run_01_replay.json</code>.</div>`;
          }
          return '';
        }
        const items = es.top_errors.slice(0, 3).map(e =>
          `<li><code>${String(e.error).slice(0, 200)}</code> (${e.count}x)</li>`
        ).join('');
        return `<div class="error-banner"><strong>All ${es.total_failures} requests failed</strong> — metrics are zero until replay succeeds.<ul class="error-list">${items}</ul></div>`;
      })();

      return `
        <div class="panel ${headClass}">
          <div class="panel-head ${headClass}">
            <h2>${label}</h2>
            <span class="pill ${status}">${status}</span>
          </div>
          ${errBlock}
          <div class="hero ${headClass}${cmpHighlight(platform, 'output_tokens_per_second', r.output_tokens_per_second, other?.output_tokens_per_second) === 'tpu-win' ? ' tpu-win' : ''}">
            <div class="big">${fmt(r.output_tokens_per_second, 1)}${heroIndicator(platform, 'output_tokens_per_second', r.output_tokens_per_second, other?.output_tokens_per_second)}</div>
            <div class="label">output tokens / sec</div>
          </div>
          <div class="grid">
            ${metricSection('Performance')}
            ${metric('Model', r.model || '—')}
            ${metric('Infrastructure', r.infrastructure || '—')}
            ${metric('Wall time', fmt(r.wall_time_s, 2) + ' s', cmpHighlight(platform, 'wall_time_s', r.wall_time_s, other?.wall_time_s))}
            ${metric('Requests', `${r.successful_requests ?? '—'} ok / ${r.failed_requests ?? 0} err`)}
            ${metric('Throughput (RPS)', fmt(r.requests_per_second, 2), cmpHighlight(platform, 'requests_per_second', r.requests_per_second, other?.requests_per_second))}
            ${metric('Generated tokens', fmt(r.total_generated_tokens, 0))}
            ${metric('Input tokens', fmt(r.total_input_tokens, 0))}
            ${metric('Total throughput', fmt(r.throughput_tok_s, 1) + ' tok/s', cmpHighlight(platform, 'throughput_tok_s', r.throughput_tok_s, other?.throughput_tok_s))}
            ${metric('TTFT p50', fmt(ttft.p50, 1) + ' ms')}
            ${metric('TTFT p95', fmt(ttft.p95, 1) + ' ms', cmpHighlight(platform, 'ttft_p95', ttft.p95, other?.ttft_ms?.p95))}
            ${metric('TTFT p99', fmt(ttft.p99, 1) + ' ms')}
            ${metric('Latency p95', fmt(lat.p95, 1) + ' ms', cmpHighlight(platform, 'latency_p95', lat.p95, other?.latency_ms?.p95))}
            ${metric('Avg duration', fmt(lat.avg, 1) + ' ms')}
            ${metric('Avg ITL', fmt(itl.avg, 2) + ' ms', cmpHighlight(platform, 'avg_itl', itl.avg, other?.itl_ms?.avg))}
            ${metric('ITL p95', fmt(itl.p95, 2) + ' ms')}
            ${metric('MFU', fmt(hw.mfu_percent, 2) + '%', cmpHighlight(platform, 'mfu_percent', hw.mfu_percent, other?.hardware_utilization?.mfu_percent))}
            ${metric('Achieved TFLOPS', fmt(hw.achieved_tflops, 4), cmpHighlight(platform, 'achieved_tflops', hw.achieved_tflops, other?.hardware_utilization?.achieved_tflops))}
            ${metric('Peak TFLOPS', fmt(hw.peak_tflops, 0))}
            ${metricSection('Cost & energy')}
            ${metric('Hourly rate', fmtUsd(cm.hourly_cost_usd, 2) + '/hr')}
            ${metric('Run cost', fmtUsd(cm.run_cost_usd), cmpHighlight(platform, 'run_cost_usd', cm.run_cost_usd, otherCm.run_cost_usd))}
            ${metric('Cost / output token', fmtUsd(cm.cost_per_output_token_usd, 6), cmpHighlight(platform, 'cost_per_output_token_usd', cm.cost_per_output_token_usd, otherCm.cost_per_output_token_usd))}
            ${metric('Cost / wall second', fmtUsd(cm.cost_per_wall_second_usd, 4), cmpHighlight(platform, 'cost_per_wall_second_usd', cm.cost_per_wall_second_usd, otherCm.cost_per_wall_second_usd))}
            ${metric('Cost / 1M out tokens', fmtUsd(cm.cost_per_million_output_tokens_usd, 2), cmpHighlight(platform, 'cost_per_million_output_tokens_usd', cm.cost_per_million_output_tokens_usd, otherCm.cost_per_million_output_tokens_usd))}
            ${metric('Perf / $', fmt(cm.performance_per_dollar_tok_s, 1) + ' tok/s/$', cmpHighlight(platform, 'performance_per_dollar_tok_s', cm.performance_per_dollar_tok_s, otherCm.performance_per_dollar_tok_s))}
            ${metric('Perf / watt', fmt(cm.performance_per_watt_tok_s, 2) + ' tok/s/W', cmpHighlight(platform, 'performance_per_watt_tok_s', cm.performance_per_watt_tok_s, otherCm.performance_per_watt_tok_s))}
            ${metric('Power (TDP est.)', fmt(cm.power_watts, 0) + ' W')}
            ${metricSection('Server')}
            ${metric('KV cache peak', fmt(srv.peak_kv_cache_usage_pct, 2) + '%')}
            ${metric('Prefix hit rate', fmt(srv.prefix_cache_hit_rate_pct, 1) + '%')}
            ${metric('Prefix hits', fmt(srv.prefix_cache_hits, 0))}
            ${metric('Peak queued', fmt(srv.peak_queued_requests, 1))}
            ${metric('Peak running', fmt(srv.peak_running_requests, 1))}
          </div>
          ${renderServingBlock(r)}
        </div>`;
    }

    function renderCompare(tpu, gpu) {
      if (!tpu?.has_replay || !gpu?.has_replay) {
        compareBar.classList.remove('visible');
        return;
      }
      const a = gpu.replay;
      const b = tpu.replay;
      const ca = gpu.cost_metrics || a?.cost_metrics || {};
      const cb = tpu.cost_metrics || b?.cost_metrics || {};
      const rows = [
        ['Output tok/s', a.output_tokens_per_second, b.output_tokens_per_second, true],
        ['TTFT p95 (ms)', a.ttft_ms?.p95, b.ttft_ms?.p95, false],
        ['Latency p95 (ms)', a.latency_ms?.p95, b.latency_ms?.p95, false],
        ['MFU %', a.hardware_utilization?.mfu_percent, b.hardware_utilization?.mfu_percent, true],
        ['Wall time (s)', a.wall_time_s, b.wall_time_s, false],
        ['Run cost ($)', ca.run_cost_usd, cb.run_cost_usd, false],
        ['Cost / output token', ca.cost_per_output_token_usd, cb.cost_per_output_token_usd, false],
        ['Perf / watt (tok/s/W)', ca.performance_per_watt_tok_s, cb.performance_per_watt_tok_s, true],
        ['Perf / $ (tok/s/$)', ca.performance_per_dollar_tok_s, cb.performance_per_dollar_tok_s, true],
      ];
      compareRows.innerHTML = rows.map(([label, gpuVal, tpuVal, higherBetter]) => {
        const ng = Number(gpuVal), nt = Number(tpuVal);
        let win = '—';
        let winCls = '';
        if (!Number.isNaN(ng) && !Number.isNaN(nt) && ng !== nt) {
          const gpuWins = higherBetter ? ng > nt : ng < nt;
          win = gpuWins ? '↑ GPU' : '↑ TPU';
          winCls = gpuWins ? 'gpu-win' : 'tpu-win';
        }
        const fmtVal = (v) => label.includes('$') || label.includes('Cost') ? fmtUsd(v, 6) : fmt(v);
        return `<div class="compare-row"><span>${label}</span><span><span style="color:var(--gpu)">GPU ${fmtVal(gpuVal)}</span> · <span style="color:var(--tpu)">TPU ${fmtVal(tpuVal)}</span> <span class="winner ${winCls}">${win !== '—' ? win : ''}</span></span></div>`;
      }).join('');
      compareBar.classList.add('visible');
    }

    async function load() {
      try {
        const [tpuRes, gpuRes, migRes, statusRes, hwRes] = await Promise.all([
          fetch('/api/results/tpu').then(r => r.json()),
          fetch('/api/results/gpu').then(r => r.json()),
          fetch('/api/migration').then(r => r.json()),
          fetch('/api/status').then(r => r.json()),
          fetch('/api/hardware').then(r => r.ok ? r.json() : null).catch(() => null),
        ]);
        panelsEl.innerHTML = renderPanel('gpu', gpuRes, tpuRes) + renderPanel('tpu', tpuRes, gpuRes);
        renderCompare(tpuRes, gpuRes);
        renderHardwareSpecs(resolveHardware(hwRes, migRes));
        const src = statusRes.data_source || 'local';
        const bucket = statusRes.gcs_bucket ? `gs://${statusRes.gcs_bucket}/${statusRes.gcs_prefix || 'latest'}` : '';
        const manifestAt = statusRes.manifest?.updated_at;
        document.getElementById('data-source').textContent =
          `Source: ${src}${bucket ? ' · ' + bucket : ''}${manifestAt ? ' · updated ' + manifestAt : ''}`;
        updatedEl.textContent = 'updated ' + new Date().toLocaleTimeString();
        updatedEl.className = 'pill';
      } catch (e) {
        updatedEl.textContent = 'fetch error';
        updatedEl.className = 'pill missing';
      }
    }

    document.getElementById('refresh').onclick = load;
    document.getElementById('auto').onclick = () => {
      autoOn = !autoOn;
      document.getElementById('auto').textContent = 'Auto: ' + (autoOn ? 'ON' : 'OFF');
      if (autoOn) startAuto(); else clearInterval(timer);
    };

    function startAuto() {
      clearInterval(timer);
      timer = setInterval(load, 3000);
    }

    load();
    startAuto();
  </script>
</body>
</html>
