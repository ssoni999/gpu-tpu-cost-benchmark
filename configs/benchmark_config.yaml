# Frozen benchmark contract — identical on GPU and TPU.
# Recipe repos supply infra/serving patterns; this file is the source of truth
# for workload shape, platform serving params, and K8s manifests (make manifests).

model: "Qwen/Qwen2.5-0.5B-Instruct"
workload_type: inference

benchmark:
  num_prompts: 100
  input_tokens: 1024
  output_tokens: 128
  seed: 100
  temperature: 0
  warmup_requests: 10
  measured_runs: 3
  request_rate: inf          # vllm: --request-rate inf
  dataset_name: random
  ignore_eos: true

# Workload complexity tiers for UI comparison (Simple / Medium / Complex).
# Run: make trace-all && make replay-all (or per-tier: TIER=small make trace && TIER=small make replay ...)
default_workload: medium

workloads:
  small:
    label: Simple
    description: "Canonical workload/prompts.jsonl — 100 structured inference requests (same trace file as legacy medium benchmark)."
    analogy: "Single-GPU PyTorch vision smoke test"
    trace_file: workload/prompts.jsonl
    num_prompts: 100
    input_tokens: 1024
    max_input_tokens: 30000
    output_tokens: 128
    trace_span_seconds: 120
    gpu_throughput_factor: 0.92
    tpu_throughput_factor: 0.78
  medium:
    label: Medium
    description: "Steady batch inference — moderate concurrency and context length."
    analogy: "Multi-GPU DDP sequence classification benchmark"
    num_prompts: 100
    input_tokens: 1024
    output_tokens: 128
    gpu_throughput_factor: 1.0
    tpu_throughput_factor: 1.0
  high:
    label: Complex
    description: "Heavy sustained load — long context, many requests. TPU throughput and cost/token often improve."
    analogy: "JAX multi-GPU SPMD tensor-parallel benchmark"
    num_prompts: 200
    input_tokens: 2048
    output_tokens: 256
    trace_span_seconds: 600
    shared_prefix_tokens: 128
    gpu_throughput_factor: 1.08
    tpu_throughput_factor: 1.65

slo:
  latency_ttft_p95_ms: 2000
  minimum_success_rate: 1.0

gpu:
  platform: gpu
  accelerator: nvidia-tesla-t4
  accelerator_count: 1
  machine_type: n1-standard-4
  power_watts: 70
  framework: vllm
  peak_tflops: 65
  node_pool:
    name: gpu-pool
    node_count: 1
    machine_type: n1-standard-4
    vcpu: 4
    system_memory_gib: 15
    accelerator_memory_gib: 16
    power_watts: 70
    interconnect: PCIe 3.0 x16
    network_gbps: 32
  docker_image: vllm/vllm-openai:latest
  recipe_ref: ../gpu-recipes/inference/g4/single-host-serving/vllm/README.md
  k8s:
    deployment_name: tiny-model-gpu-server
    service_name: tiny-model-gpu-service
    app_label: tiny-model-gpu-server
    container_name: vllm-gpu
    port: 8000
    output_file: tiny-model-gpu.yaml
  infra:
    node_selector:
      cloud.google.com/gke-accelerator: nvidia-t4
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
        nvidia.com/gpu: 1
      limits:
        nvidia.com/gpu: 1
  serving:
    max_model_len: 4096
    max_num_batched_tokens: 4096
    max_num_seqs: 128
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.95
    extra_args:
      - --served-model-name=Qwen/Qwen2.5-0.5B-Instruct
      - --host=0.0.0.0

tpu:
  platform: tpu
  generation: v5e
  accelerator: v5litepod-1
  accelerator_count: 1
  runtime_version: v2-alpha-tpuv5-lite
  power_watts: 200
  framework: vllm
  peak_tflops: 197
  node_pool:
    name: tpu-v5-lite-podslice
    node_count: 1
    machine_type: v5e-1x1 (CT5LP)
    vcpu: 24
    system_memory_gib: 48
    accelerator_memory_gib: 16
    power_watts: 200
    topology: 1x1
    interconnect: ICI (400 Gbps/chip)
    network_gbps: 100
  docker_image: vllm/vllm-tpu:latest
  # Official tpu-recipes Qwen3 guide targets v6e; this project pins v5e (see README).
  recipe_ref: ../tpu-recipes/inference/trillium/vLLM/Qwen3/README.md
  k8s:
    deployment_name: tiny-model-server
    service_name: tiny-model-service
    app_label: tiny-model-server
    container_name: vllm-tpu
    port: 8000
    output_file: tiny-model.yaml
  infra:
    node_selector:
      cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
      cloud.google.com/gke-tpu-topology: 1x1
    tolerations:
      - key: cloud.google.com/gke-tpu-accelerator
        operator: Exists
        effect: NoSchedule
    resources:
      limits:
        google.com/tpu: 1
      requests:
        google.com/tpu: 1
  serving:
    max_model_len: 4096
    max_num_batched_tokens: 4096
    max_num_seqs: 128
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.98
    extra_args: []

pricing:
  # Defaults for UI cost metrics when results/{platform}/run_01_environment.json is absent.
  # Override at runtime via gpu.env / tpu.env → environment.json.
  gpu_accelerator_hourly_usd: 0.35
  gpu_vm_hourly_usd: 0.10
  tpu_accelerator_hourly_usd: 1.20
  tpu_vm_hourly_usd: 0.0
  gpu_tdp_watts: 70          # NVIDIA T4 chip TDP (approx)
  tpu_tdp_watts: 200         # TPU v5e single chip (approx)

storage:
  gcs:
    bucket: gpu-tpu-benchmark-storage
    project: gpu-tpu-benchmark-results
    prefix: latest          # gs://{bucket}/latest/{tpu|gpu}/run_01_replay.json
    archive_prefix: runs    # timestamped history under runs/{platform}/
